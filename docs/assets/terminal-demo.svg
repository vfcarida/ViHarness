<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .header { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; }
      .term { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, Menlo, monospace; font-size: 13px; line-height: 20px; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0f6fc; }
      .comment { fill: #8b949e; }
      .green { fill: #3fb950; font-weight: 600; }
      .cyan { fill: #39c5cf; }
      .yellow { fill: #d29922; }
      .purple { fill: #bc8cff; }
      .white { fill: #e6edf3; }
      .gray { fill: #6e7681; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="880" height="500" class="bg" />

  <!-- Window Header -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 868 0 C 874.627 0 880 5.373 880 12 L 880 38 L 0 38 Z" class="header" />
  <circle cx="20" cy="19" r="6" class="btn-red" />
  <circle cx="38" cy="19" r="6" class="btn-yellow" />
  <circle cx="56" cy="19" r="6" class="btn-green" />
  <text x="440" y="24" text-anchor="middle" class="title">vi-harness solve — autonomous coding agent</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 62)" class="term">
    <!-- Command Prompt -->
    <text y="0">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">vi-harness solve -p "Fix timing race in session validator and verify" --judge-command "npm test"</tspan>
    </text>

    <!-- Init Banner -->
    <text y="24" class="gray">[vi-harness] Initializing solve agent on workspace: /workspace/auth-service</text>
    <text y="44" class="gray">[vi-harness] Model: gpt-4o | Prompt Caching: enabled (static prefix) | AST Gate: ACTIVE</text>
    <text y="64" class="cyan">🚀 Task Started: "Fix timing race in session validator and verify"</text>

    <!-- Iteration 1 -->
    <text y="92" class="purple">── Iteration 1 (Phase: INIT ──&gt; EXPLORE) ─────────────────────────────────────────</text>
    <text y="112" class="white">💡 Proposed Tools: <tspan class="yellow">batch_find_symbols</tspan> [SessionValidator, validateToken]</text>
    <text y="132" class="green">✅ Executed: batch_find_symbols (14ms)</text>
    <text y="152" class="gray">    │ Found 2 AST symbols across src/session.ts and src/validator.ts</text>

    <!-- Iteration 2 -->
    <text y="180" class="purple">── Iteration 2 (Phase: EXPLORE ──&gt; IMPLEMENT) ───────────────────────────────────</text>
    <text y="200" class="white">💡 Proposed Tool: <tspan class="yellow">edit_file</tspan> (src/session-validator.ts)</text>
    <text y="220" class="green">🛡️  PreWriteSyntaxGate: AST syntax valid (0 parse errors, clean TypeScript AST)</text>
    <text y="240" class="green">✅ Executed: edit_file (19ms)</text>
    <text y="260" class="gray">    │ Applied atomic search-and-replace: +12 lines, -4 lines (HMAC nonce lock)</text>

    <!-- Iteration 3: Judge-in-the-Loop -->
    <text y="288" class="purple">── Iteration 3 (Phase: IMPLEMENT ──&gt; VERIFY) ────────────────────────────────────</text>
    <text y="308" class="white">⚖️  Judge-in-the-Loop: Executing judge command "<tspan class="cyan">npm test</tspan>"...</text>
    <text y="328" class="green">[JudgeLoop] Attempt 1/3 Verdict: [AC] (exitCode: 0, duration: 284ms)</text>
    <text y="348" class="green">🎉 Judge verdict ACCEPTED! Empirical verification oracle satisfied.</text>

    <!-- Summary Box -->
    <g transform="translate(0, 366)">
      <rect width="832" height="58" class="card" />
      <text x="16" y="24" class="green">🎉 Goal COMPLETED in 3 iterations (480ms elapsed)</text>
      <text x="16" y="44" class="white">   Tokens: <tspan class="yellow">1,280</tspan> (-80.3% vs. baseline) │ Cost: <tspan class="yellow">$0.0014 USD</tspan> │ Patch: <tspan class="cyan">predictions/task-042.patch</tspan></text>
    </g>
  </g>
</svg>
